name: Publish MainQuest web app (optional)

# Optional: hosts the installable web version on GitHub Pages.
# Enable once in repo Settings → Pages → Source: "GitHub Actions".
on:
  workflow_dispatch:   # manual only (Actions → Publish → Run) after enabling Pages

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
