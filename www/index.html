<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="MainQuest — your planner, built like a game.">
  <title>MainQuest</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header id="orient" aria-live="polite"></header>
    <main id="view"></main>
    <nav id="tabs" aria-label="Main">
      <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
      <button data-tab="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 14h2M14 14h2M8 17h2"/></svg><span>Calendar</span></button>
      <button data-tab="school"><svg viewBox="0 0 24 24"><path d="M2 9 12 4l10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5M22 9v6"/></svg><span>School</span></button>
      <button data-tab="routines"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg><span>Routines</span></button>
      <button data-tab="me"><svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 4.5 3.4 8.3 8 10 4.6-1.7 8-5.5 8-10V6z"/><path d="m9 12 2 2 4-4"/></svg><span>Profile</span></button>
    </nav>
  </div>
  <div id="overlay" hidden></div>
  <div id="sheet-wrap" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" hidden></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="config.js"></script>
  <script src="metrics.js"></script>
  <script src="teks.js"></script>
  <script src="content.js"></script>
  <script src="core.js"></script>
  <script src="focus.js"></script>
  <script src="school.js"></script>
  <script src="calendar.js"></script>
  <script src="gsync.js"></script>
  <script src="cloud.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
