<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14162b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="MainQuest — one mission at a time.">
  <title>MainQuest</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header id="orient" aria-live="polite"></header>
    <main id="view"></main>
    <nav id="tabs" aria-label="Main">
      <button data-tab="now"><span class="ti">🎯</span><span class="tl">Now</span></button>
      <button data-tab="missions"><span class="ti">📋</span><span class="tl">Missions</span></button>
      <button data-tab="routines"><span class="ti">🔁</span><span class="tl">Routines</span></button>
      <button data-tab="me"><span class="ti" id="tab-buddy">🥚</span><span class="tl">Me</span></button>
    </nav>
  </div>
  <div id="overlay" hidden></div>
  <div id="sheet-wrap" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" hidden></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="content.js"></script>
  <script src="core.js"></script>
  <script src="focus.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
