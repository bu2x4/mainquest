<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MainQuest — Parent dashboard</title>
<style>
:root {
  color-scheme: light;
  --plane: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --base: #c3c2b7; --ring: rgba(11,11,11,.10);
  --s1: #2a78d6; --s2: #eb6834; --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --crit: #d03b3b;
  --band: rgba(42,120,214,.08); --accent: #2a78d6; --accent-ink: #fff; --chip: #f1f0ec;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --base: #383835; --ring: rgba(255,255,255,.10);
    --s1: #3987e5; --s2: #d95926; --good-ink: #0ca30c; --band: rgba(57,135,229,.12); --accent: #3987e5; --chip: #242422;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--plane); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
[hidden] { display: none !important; }
a { color: var(--accent); }
button { font: inherit; cursor: pointer; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px 60px; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--plane); border-bottom: 1px solid var(--grid); }
header.top .wrap { display: flex; align-items: center; gap: 14px; padding: 12px 20px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 17px; }
.brand small { font-weight: 400; color: var(--ink2); margin-left: 6px; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
nav.tabs button { border: 0; background: none; padding: 7px 11px; border-radius: 8px; color: var(--ink2); }
nav.tabs button.on { background: var(--chip); color: var(--ink); font-weight: 600; }
.filters { display: flex; gap: 8px; align-items: center; margin: 18px 0 6px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--chip); border-radius: 9px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 7px; color: var(--ink2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--ring); font-weight: 600; }
.muted { color: var(--ink2); margin: 2px 0 0; font-size: 13.5px; }
.faint { color: var(--muted); font-size: 13px; }
h2 { font-size: 20px; margin: 26px 0 10px; }
h3 { font-size: 15.5px; margin: 0; }
.card { background: var(--surface); border-radius: 12px; box-shadow: 0 0 0 1px var(--ring); padding: 16px 18px; margin: 12px 0; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid > .card { margin: 0; }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin: 12px 0; }
.tile { background: var(--surface); border-radius: 12px; box-shadow: 0 0 0 1px var(--ring); padding: 14px 16px; }
.tile .k { font-size: 13px; color: var(--ink2); }
.tile .v { font-size: 30px; font-weight: 650; letter-spacing: -.01em; margin: 2px 0; font-variant-numeric: tabular-nums; }
.tile .d { font-size: 12.5px; color: var(--muted); }
.tile .d b { font-weight: 600; color: var(--ink2); }
.ch { width: 100%; height: auto; display: block; overflow: visible; }
.ch .grid { stroke: var(--grid); stroke-width: 1; }
.ch .base { stroke: var(--base); stroke-width: 1; }
.ch .ax { fill: var(--muted); font-size: 11px; }
.ch .bar { fill: var(--s1); }
.ch .bar.dim { fill: var(--base); }
.ch .ln { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; }
.ch .ln2 { stroke: var(--s2); }
.ch .dot { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
.ch .dot2 { fill: var(--s2); }
.ch .goal { stroke: var(--ink2); stroke-dasharray: 4 4; stroke-width: 1; }
.ch .goal-t, .ch .mk-t { fill: var(--ink2); }
.ch .band { fill: var(--band); }
.ch .marker { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 2 3; }
.ch .nodata { fill: var(--muted); }
.ch-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
.tbtn { border: 0; background: var(--chip); color: var(--ink2); border-radius: 7px; padding: 4px 10px; font-size: 12.5px; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink2); margin-top: 4px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.lg1 { background: var(--s1); } .lg2 { background: var(--s2); }
.ch-tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--ring), 0 6px 20px rgba(0,0,0,.15); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; max-width: 260px; }
.hb { display: grid; gap: 6px; }
.hb-row { display: grid; grid-template-columns: minmax(120px, 38%) 1fr 64px; gap: 10px; align-items: center; font-size: 13.5px; }
.hb-l small { display: block; color: var(--muted); font-size: 11.5px; }
.hb-track { height: 10px; background: var(--chip); border-radius: 5px; overflow: hidden; }
.hb-track i { display: block; height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; }
.hb-v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink2); }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; color: var(--ink2); font-weight: 600; border-bottom: 1px solid var(--base); padding: 7px 8px; white-space: nowrap; }
.tbl td { border-bottom: 1px solid var(--grid); padding: 7px 8px; vertical-align: top; }
.tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; }
.st::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.st.good { color: var(--good-ink); } .st.good::before { background: var(--good); }
.st.warn { color: var(--ink2); } .st.warn::before { background: var(--warn); }
.st.crit { color: var(--crit); } .st.crit::before { background: var(--crit); }
.flag { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--grid); }
.flag:first-child { border-top: 0; }
.flag .ic { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--warn); color: #0b0b0b; }
.flag .ic.good { background: var(--good); color: #fff; }
.btn { border: 0; border-radius: 8px; padding: 8px 14px; background: var(--chip); color: var(--ink); font-weight: 550; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
input.f, select.f, textarea.f { font: inherit; color: var(--ink); background: var(--plane); border: 1px solid var(--base); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea.f { min-height: 70px; resize: vertical; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1 1 200px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.paper { background: var(--plane); border-radius: 10px; box-shadow: 0 0 0 1px var(--ring); padding: 10px 12px; cursor: pointer; }
.paper:hover { box-shadow: 0 0 0 2px var(--accent); }
.paper .pt { font-weight: 600; }
.imgs img { max-width: 100%; border-radius: 8px; margin: 8px 0; box-shadow: 0 0 0 1px var(--ring); }
.login { max-width: 440px; margin: 10vh auto; }
.pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--ink2); }
.code { font: 600 34px/1 ui-monospace, Menlo, monospace; letter-spacing: .2em; padding: 12px 0; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 9px; z-index: 60; font-size: 14px; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--base); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -2px; }
@keyframes s { to { transform: rotate(360deg); } }
.report { max-width: 820px; }
.report h1 { font-size: 22px; margin: 0 0 4px; }
.report h2 { font-size: 16px; margin: 22px 0 8px; border-bottom: 1px solid var(--grid); padding-bottom: 4px; }
.noprint {}
@media print {
  :root { color-scheme: light; --plane: #fff; --surface: #fff; --ink: #000; --ink2: #333; --chip: #f1f0ec; --s1: #2a78d6; --s2: #eb6834; --grid: #e1e0d9; --base: #c3c2b7; --ring: transparent; }
  header.top, .noprint, .filters, .tbtn, .toast, .ch-tip { display: none !important; }
  .card { box-shadow: none; padding: 0; }
  body { font-size: 11.5pt; }
  .report h2 { break-after: avoid; } .card, table, svg { break-inside: avoid; }
}
</style>
</head>
<body>
<div id="app"><div class="login card"><span class="spin"></span> Loading…</div></div>
<script src="metrics.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
